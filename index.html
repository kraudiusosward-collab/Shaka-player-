<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player - Fixed</title>
    
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        .video-js { width: 100vw !important; height: 100vh !important; }
    </style>
</head>
<body>

    <video id="my-video" class="video-js vjs-default-skin" crossorigin="anonymous" playsinline></video>

<script>
    // Link yako ya moja kwa moja
    var streamUrl = "http://imediatv666.store:7777/live/Norma11/XGSYSF/162739.m3u8";

    // Kuanzisha player ya Video.js
    var player = videojs('my-video', {
        controls: true,
        autoplay: true,
        preload: 'auto',
        muted: true, // Muhimu ili kuzuia browser isibloque autoplay
        fluid: false,
        html5: {
            vhs: {
                overrideNative: true // Hii inalazimisha browser kutumia engine ya ndani kucheza m3u8 bila kujali vikwazo vya kawaida
            }
        }
    });

    // Weka source ya video
    player.src({
        src: streamUrl,
        type: 'application/x-mpegURL'
    });

    // Sauti irudi mara tu video ikianza kucheza yenyewe
    player.ready(function() {
        player.play().then(function() {
            player.muted(false); // Washa sauti
            player.volume(1.0);  // Sauti iwe juu 100%
        }).catch(function(error) {
            console.log("Autoplay ilizuiliwa, mtumiaji anapaswa kubonyeza play: ", error);
        });
    });
</script>
</body>
</html>
