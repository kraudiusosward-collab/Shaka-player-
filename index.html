        function showControls() {
            overlay.classList.remove('controls-hidden');
            document.body.style.cursor = 'default';
            clearTimeout(controlsTimeout);
            if (!video.paused && document.getElementById('settingsMenu').classList.contains('hidden')) {

        function hideControls() {
            overlay.classList.add('controls-hidden');
            document.body.style.cursor = 'none';
        }

        document.addEventListener('mousemove', showControls);
        document.addEventListener('touchstart', showControls);
        video.addEventListener('play', showControls);

        window.onload = function() {
            if (!streamUrl) {
                showError("Stream not available. Channel might be inactive.");
                return;
            }
            
            // SAVE TO HISTORY (Continue Watching)
            localStorage.setItem('nurhd_last_watched', JSON.stringify({
                id: 12,
                name: "Azam Sports  2 HD ",
                thumbnail: "https://aztv.mr.videoready.tv/videoready/azam/image/fetch/f_auto,fl_lossy,q_70,h_auto,w_320/https://ds.aztv.videoready.tv/util/1780304716341-CAFU17TZVSENEGAL-PosterImage.png",
                bgColor: "#1a1a2e"
            }));

            startPlayback(streamUrl, clearKey, streamType);
            showControls();
            
                    };

        function startPlayback(url, clearkey, type) {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            var playbackPromise;
            if (type === 'hls' || url.indexOf('.m3u8') !== -1) {
                playbackPromise = playHLS(url);
            } else {
                playbackPromise = playMPD(url, clearkey);
            }

            if (playbackPromise && playbackPromise.then) {
                playbackPromise.then(function() {
                    setTimeout(() => {
                        document.getElementById('loadingIndicator').classList.add('opacity-0');
                        setTimeout(() => {
                            document.getElementById('loadingIndicator').classList.add('hidden');
                        }, 1000);
                    }, 500);
                })['catch'](function(e) {
                    showError("Playback Error: " + (e.message || e.code || "Unknown"), url);
                });
            } else {
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        }

        function playHLS(url) {
            if (window.Hls && Hls.isSupported()) {
                hls = new Hls({
                    xhrSetup: function(xhr, xhrUrl) {
                        if (xhrUrl.indexOf('mpingotv.com') !== -1) {
                            xhr.setRequestHeader('X-Requested-With', detectedIdentity);
                            xhr.setRequestHeader('Authorization', 'Bearer ' + mpingoApiKey);
                        }
                        
                        // AzamTV/Nagra headers for HLS too if needed
                        var useNagraHeaders = false;
                        if (useNagraHeaders) {
                            xhr.setRequestHeader('User-Agent', 'ReactNativeVideo/4.6 (Linux;Android 11) ExoPlayerLib/2.13.3');
                            xhr.setRequestHeader('Referer', 'app.azamtvmax.com');
                            xhr.setRequestHeader('Origin', 'app.azamtvmax.com');
                            xhr.setRequestHeader('Connection', 'Keep-Alive');
                        }
                    }
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
                return { then: function(cb) { cb(); return { 'catch': function(c) { 
                    hls.on(Hls.Events.ERROR, function(ev, data) { if (data.fatal) c(data); });
                } }; } };
            } else {
                video.src = url;
                video.play();
                return { then: function(cb) { cb(); return { 'catch': function() {} }; } };
            }
        }

        function playMPD(url, clearkey) {
            if (!window.shaka || !shaka.Player.isBrowserSupported()) {
                showError("DASH not supported by this browser.");
                return null;
            }

            shakaPlayer = new shaka.Player(video);
            
            var useNagraHeaders = false;
            
            shakaPlayer.getNetworkingEngine().registerRequestFilter(function(type, request) {
                // MPINGO API Headers (Always applied if URL matches)
                if (request.uris[0].indexOf('mpingotv.com') !== -1) {
                    request.headers['X-Requested-With'] = detectedIdentity;
                    request.headers['Authorization'] = 'Bearer ' + mpingoApiKey;
                }
                
                // AzamTV/Nagra Specific Headers (Conditional)
                if (useNagraHeaders) {
                    // Standard Headers for AzamTV/Nagra
                    request.headers['User-Agent'] = 'ReactNativeVideo/4.6 (Linux;Android 11) ExoPlayerLib/2.13.3';
                    request.headers['Referer'] = 'app.azamtvmax.com';
                    request.headers['Origin'] = 'app.azamtvmax.com';
                    request.headers['Connection'] = 'Keep-Alive';
                    
                    // License specific headers (DRM)
                    if (type == shaka.net.NetworkingEngine.RequestType.LICENSE) {
                        request.headers['Accept'] = 'application/octet-stream';
                        request.headers['Accept-Encoding'] = 'gzip';
                        request.headers['Content-Type'] = 'application/octet-stream';
                        request.headers['Nv-Tenant-Id'] = 'AZY4SJ9B';
                        request.headers['Nv-Authorizations'] = "";
                    }
                }
            });
            
            var config = {
                drm: {
                    servers: {
                        'com.widevine.alpha': "https://azy4sj9b.anycast.nagra.com/AZY4SJ9B/wvls/contentlicenseservice/v1/licenses"
                    }
                }
            };
            
            if (clearkey) {
                config.drm.clearKeys = {};
                if (clearkey.indexOf(':') !== -1) {
                    var parts = clearkey.split(':');
                    config.drm.clearKeys[parts[0]] = parts[1];
                }
            }
            
            shakaPlayer.configure(config);

            return shakaPlayer.load(url.trim()).then(function() {
                video.play();
            });
        }

        function togglePlayPause() {
            if (video.paused) {
                video.play();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                video.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                showControls();
            }
        }

        function rotateVideo() {
            rotateAngle = (rotateAngle + 90) % 360;
            video.className = 'w-full h-full object-contain';
            if (rotateAngle === 90) video.classList.add('rotate-90');
            else if (rotateAngle === 180) video.classList.add('rotate-180');
            else if (rotateAngle === 270) video.classList.add('rotate-270');
        }

        function toggleFullscreen() {
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                    else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            } catch (e) {}
        }

        function toggleMute() {
            video.muted = !video.muted;
            volumeBar.value = video.muted ? 0 : video.volume;
            updateVolumeIcons();
        }

        function updateVolumeIcons() {
            if (video.muted || video.volume === 0) {
                document.getElementById('volumeIcon').classList.add('hidden');
                document.getElementById('muteIcon').classList.remove('hidden');
            } else {
                document.getElementById('volumeIcon').classList.remove('hidden');
                document.getElementById('muteIcon').classList.add('hidden');
            }
        }

        function openSettingsMenu(e) {
            if (e && e.stopPropagation) e.stopPropagation();
            var menu = document.getElementById('settingsMenu');
            menu.classList.toggle('hidden');
            if (!menu.classList.contains('hidden')) {
                populateQuality();
                populateAudio();
            }
        }

            document.getElementById('settingsMenu').classList.add('hidden');
            showControls();

                         (hls && hls.liveSyncPosition) ||
                         (video.duration > 86400 * 30); // 30 days is likely live timestamp

            if (isLive) {

                // Professional LIVE indicator in timer area
                currentTimeText.innerHTML = `
                    <div class="flex items-center gap-1.5 bg-red-500/10 text-red-500 border border-red-500/20 px-2 py-0.5 rounded-md text-[9px] font-bold tracking-tight">
                        <span class="relative flex h-1.5 w-1.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-red-600"></span>
                        </span>
                        LIVE
                    </div>
                `;
                durationText.textContent = '';
                progressBar.classList.add('invisible');
                return;
            }

            if (liveBadge) liveBadge.classList.add('hidden');
            progressBar.classList.remove('invisible');
            
            var perc = (video.currentTime / video.duration) * 100;
            progressBar.value = perc || 0;
            currentTimeText.textContent = formatTime(video.currentTime);
            durationText.textContent = formatTime(video.duration);
        });

        progressBar.addEventListener('input', function() {
            video.currentTime = (progressBar.value / 100) * video.duration;
        });

        volumeBar.addEventListener('input', function() {
            video.volume = volumeBar.value;
            video.muted = (video.volume === 0);
            updateVolumeIcons();
        });

        function formatTime(s) {
            if (isNaN(s) || s === Infinity || s > 86400 * 30) return "00:00";
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            var sec = Math.floor(s % 60);
            return (h > 0 ? h + ":" : "") + (m < 10 ? "0" + m : m) + ":" + (sec < 10 ? "0" + sec : sec);
        }

        function populateQuality() {
            var div = document.getElementById('qualityLevels');
            div.innerHTML = '';
            if (shakaPlayer) {
                var tracks = shakaPlayer.getVariantTracks();
                var seenHeights = {};
                tracks.sort(function(a, b) { return b.height - a.height; }).forEach(function(t) {
                    if (!seenHeights[t.height]) {
                        seenHeights[t.height] = true;
                        var btn = document.createElement('button');
                        btn.className = "text-left px-3 py-2 text-[10px] hover:bg-white/10 rounded-lg transition";
                        btn.innerHTML = '<span class="opacity-50 min-w-[30px] inline-block">' + t.height + 'p</span> <span class="ml-2 font-mono text-blue-400">Stream</span>';
                        btn.onclick = function() { 
                            shakaPlayer.configure({ abr: { enabled: false } });
                            shakaPlayer.selectVariantTrack(t, true); 
                            closeSettingsMenu(); 
                        };
                        div.appendChild(btn);
                    }
                });
            } else {
                div.innerHTML = '<div class="text-[10px] text-gray-500 italic px-2">Auto Quality</div>';
            }
        }

        function populateAudio() {
            var div = document.getElementById('audioTracks');
            div.innerHTML = '';
            if (shakaPlayer) {
                shakaPlayer.getAudioLanguages().forEach(function(lang) {
                    var btn = document.createElement('button');
                    btn.className = "text-left px-3 py-2 text-[10px] hover:bg-white/10 rounded-lg transition capitalize";
                    btn.textContent = lang;
                    btn.onclick = function() { shakaPlayer.selectAudioLanguage(lang); closeSettingsMenu(); };
                    div.appendChild(btn);
                });
            } else {
                div.innerHTML = '<div class="text-[10px] text-gray-500 italic px-2">Default Audio</div>';
            }
        }

        function showError(msg, manifestUrl) {
            document.getElementById('loadingIndicator').classList.add('hidden');
            var errorDisplay = document.getElementById('errorDisplay');
            var errorMessage = document.getElementById('errorMessage');
            errorDisplay.classList.remove('hidden');
            
            var identityHtml = '<div class="bg-red-500/10 border border-red-500/20 p-5 rounded-xl mb-4 text-left">' +
                '<p class="text-red-400 text-xs mb-3 font-mono">' + String(msg) + '</p>' +
                '<div class="pt-4 border-t border-white/5">' +
                    '<p class="text-gray-500 text-[9px] uppercase font-black mb-1">Detected ID:</p>' +
                    '<p class="text-blue-400 font-mono text-xs break-all bg-black/40 p-2 rounded">' + (detectedIdentity || "Unidentified") + '</p>' +
                '</div>' +
            '</div>' +
            '<p class="text-[10px] text-gray-500 italic">This content is restricted to authorized apps only.</p>';
            errorMessage.innerHTML = identityHtml;
        }
    </script>
  <script src="assets/js/offline.js?v=1.0.0"></script>
