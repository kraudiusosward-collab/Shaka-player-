<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    <!-- Tunatumia HLS.js Library kwa ajili ya m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 80%; max-width: 800px; }
        video { width: 100%; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="container">
    <video id="video" controls autoplay playsinline></video>
</div>

<script>
    const video = document.getElementById('video');
    const videoSrc = 'http://het000.4rouwanda-shop.store/live/918454578001/index.m3u8';

    if (Hls.isSupported()) {
        const hls = new Hls({
            // Hapa tunaweka mipangilio ili kuzuia kukwama (buffering)
            enableWorker: true,
            lowLatencyMode: true,
            xhrSetup: function(xhr, url) {
                // Hapa tunaweka User-Agent uliyotoa
                xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36');
            }
        });
        
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
        });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Kwa ajili ya Safari (iPhone/Mac) ambayo inasoma m3u8 yenyewe
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', function() {
            video.play();
        });
    }
</script>

</body>
</html>
