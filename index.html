<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream - Proxy Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .video-box { width: 90%; max-width: 720px; border: 2px solid #444; background: #000; position: relative; }
        video { width: 100%; display: block; }
        .status { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="video-box">
    <video id="video" controls autoplay playsinline></video>
</div>
<div class="status" id="status">Inatayarisha video kupitia Proxy...</div>

<script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('status');

    // Hapa tunatumia Public Proxy (Inaitwa AllOrigins au CORS Anywhere)
    const originalUrl = 'http://het000.4rouwanda-shop.store/live/918454578001/index.m3u8';
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(originalUrl);

    if (Hls.isSupported()) {
        const hls = new Hls({
            debug: false,
            xhrSetup: function(xhr, url) {
                // Kuweka User-Agent ulioutaka
                // Kumbuka: Baadhi ya proxies zinaweza kuzuia kubadilisha User-Agent kwa sababu za kiusalama
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            }
        });

        hls.loadSource(proxyUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function() {
            statusText.innerText = "Video inacheza sasa (Proxy Active)";
            video.play();
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                statusText.innerText = "Tatizo: Server ya video bado inakataa. Huenda link imekufa au Proxy imezidiwa.";
                console.log("HLS Error:", data);
            }
        });

    } else {
        statusText.innerText = "Kivinjari chako hakisupport HLS.js";
    }
</script>

</body>
</html>
